; Bring-up test: spin one DRV8825 stepper through an SX1509 on an Arduino Nano.
; Standalone project, separate from the ESP32 firmware in ../../.
;
;   pio run -t upload            our Nano clone (old bootloader, 57600 baud)
;   pio run -e nano -t upload    a Nano with the new bootloader (115200 baud)
;   pio device monitor

[platformio]
default_envs = nano_oldboot

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SX1509 IO Expander@^3.0.6

[env:nano]
board = nanoatmega328new

[env:nano_oldboot]
board = nanoatmega328
