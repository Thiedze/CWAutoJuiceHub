[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    waspinator/AccelStepper@^1.64
    knolleary/PubSubClient@^2.8
    bogde/HX711@^0.7.5

; Hardware-free unit tests on the host: pio test -e native
[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = +<commands.cpp> +<pour.cpp>
test_build_src = yes
