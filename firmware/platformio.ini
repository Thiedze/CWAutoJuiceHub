; Nano motor controller. See docs/protocol.md and docs/hardware.md.
;
;   pio run -t upload            our Nano clone (old bootloader, 57600 baud)
;   pio run -e nano -t upload    a Nano with the new bootloader (115200 baud)
;   pio test -e native           parser tests on the host

[platformio]
default_envs = nano_oldboot

[nano]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SX1509 IO Expander@^3.0.6

[env:nano_oldboot]
extends = nano
board = nanoatmega328

[env:nano]
extends = nano
board = nanoatmega328new

; Hardware-free unit tests on the host.
[env:native]
platform = native
build_flags = -std=c++17
build_src_filter = +<commands.cpp>
test_build_src = yes
